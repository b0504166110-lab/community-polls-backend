# הגדרות פריסה ל-Render (Blueprint)
# מסד הנתונים נמצא אצל ספק נפרד (למשל Neon) - מדביקים את הכתובת שלו ב-DATABASE_URL
services:
  - type: web
    name: community-polls-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # התקנה (כולל כלי פיתוח שנדרשים ל-Build) + prisma generate + קומפילציה של TypeScript
    buildCommand: npm ci --include=dev && npm run build
    # הפעלה: Migrations למסד הנתונים -> Seed (רק לפי משתני הסביבה) -> השרת
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: מנהל האתר
      - key: SEED_DEMO_PASSWORD
        sync: false
